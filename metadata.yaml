name: astrbot_plugin_server_butler
display_name: 服务器管家
desc: 在聊天里管你的 VPS：一句话查状态、流量、容器、证书；后台自动巡检，宕机、磁盘满、流量超额、证书快过期、服务器快到期、服务挂了都会主动推送告警；每天一份服务器日报；管理员还能远程重启白名单内的 Docker 容器。配套一个纯标准库的小探针，装到每台 VPS 上即可。
short_desc: 在聊天里管 VPS：查状态、收告警、看日报
